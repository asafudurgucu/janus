name: Release

# Bir sürüm etiketi push'landığında (örn. v1.0.1) üç platformda da derler,
# imzalar (varsa) ve GitHub Releases'e taslak olarak yükler. electron-updater
# bu Release'lerden otomatik güncelleme yapar.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Actions sekmesinden elle de tetiklenebilir

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # electron-builder's macOS dmg step shells out to `python`; guarantee it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        env:
          # electron-builder bu token ile Release'e yükler (CI'da otomatik sağlanır).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS kod imzalama + notarization (secret'lar tanımlanınca otomatik devreye girer).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows kod imzalama (opsiyonel).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build && npx electron-builder --publish always
