<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e3a"/>
      <stop offset="1" stop-color="#0a0b14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="226" fill="none" stroke="#2a2f55" stroke-width="4"/>

  <!-- Terminal prompt chevron + cursor (the "gate" of Janus) -->
  <g filter="url(#glow)" stroke="url(#accent)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="332,360 480,512 332,664"/>
    <line x1="556" y1="664" x2="716" y2="664"/>
  </g>
</svg>
