<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="win"><rect x="20" y="20" width="1240" height="760" rx="14"/></clipPath>
  </defs>

  <rect width="1280" height="800" fill="#06070a"/>
  <ellipse cx="640" cy="120" rx="520" ry="180" fill="url(#glow)"/>

  <g filter="url(#sh)">
    <rect x="20" y="20" width="1240" height="760" rx="14" fill="#0f1113" stroke="#1d2024"/>
  </g>

  <g clip-path="url(#win)">
    <!-- Title bar -->
    <rect x="20" y="20" width="1240" height="40" fill="#0f1113"/>
    <circle cx="44" cy="40" r="6" fill="#fb5d6b"/>
    <circle cx="64" cy="40" r="6" fill="#fbbf24"/>
    <circle cx="84" cy="40" r="6" fill="#34d399"/>
    <text x="120" y="45" fill="#e4e7ec" font-size="14" font-weight="700">Janus</text>
    <text x="172" y="45" fill="#5b626f" font-size="12">SSH Manager  |  The Asaf Effect</text>
    <line x1="20" y1="60" x2="1260" y2="60" stroke="#1d2024"/>

    <!-- Icon rail -->
    <rect x="20" y="60" width="56" height="720" fill="#0f1113"/>
    <rect x="32" y="74" width="32" height="32" rx="8" fill="#6366f1" fill-opacity="0.18"/>
    <rect x="38" y="82" width="20" height="16" rx="3" fill="none" stroke="#818cf8" stroke-width="2"/>
    <g fill="#3a4048">
      <rect x="32" y="116" width="32" height="32" rx="8"/>
      <rect x="32" y="158" width="32" height="32" rx="8"/>
      <rect x="32" y="200" width="32" height="32" rx="8"/>
      <rect x="32" y="242" width="32" height="32" rx="8"/>
