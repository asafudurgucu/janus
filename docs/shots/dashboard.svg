        <text x="22" y="64" fill="#8b93a1" font-size="10">RAM</text><text x="271" y="64" fill="#5b626f" font-size="10" text-anchor="end">29%</text>
        <rect x="22" y="70" width="249" height="6" rx="3" fill="#1d2024"/><rect x="22" y="70" width="72" height="6" rx="3" fill="#34d399"/>
        <text x="22" y="92" fill="#8b93a1" font-size="10">Disk</text><text x="271" y="92" fill="#5b626f" font-size="10" text-anchor="end">68%</text>
        <rect x="22" y="98" width="249" height="6" rx="3" fill="#1d2024"/><rect x="22" y="98" width="169" height="6" rx="3" fill="#fbbf24"/>
