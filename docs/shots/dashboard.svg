    <rect x="280" y="76" width="30" height="30" rx="8" fill="#6366f1"/>
    <text x="291" y="97" fill="#fff" font-size="18">+</text>

    <!-- group + server rows -->
    <text x="96" y="132" fill="#8b93a1" font-size="11" font-weight="600">▾ ÜRETİM</text>
    <g font-size="13">
      <circle cx="108" cy="158" r="4" fill="#34d399"/><text x="122" y="162" fill="#e4e7ec">web-01</text><text x="122" y="176" fill="#5b626f" font-size="10">root@10.0.0.11</text>
      <circle cx="108" cy="194" r="4" fill="#34d399"/><text x="122" y="198" fill="#e4e7ec">web-02</text><text x="122" y="212" fill="#5b626f" font-size="10">root@10.0.0.12</text>
